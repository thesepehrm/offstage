name: NotesApp
options:
  bundleIdPrefix: com.example.offstage
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    GENERATE_INFOPLIST_FILE: "YES"
packages:
  OffstagePort:
    path: ../../swift/OffstagePort
targets:
  NotesApp:
    type: application
    platform: macOS
    sources: [Sources]
    dependencies:
      - package: OffstagePort
    info:
      path: Info.plist
      properties:
        CFBundleName: NotesApp
        CFBundleDisplayName: NotesApp
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
  NotesAppTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    dependencies:
      - target: NotesApp
  NotesAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [UITests]
    dependencies:
      - target: NotesApp
schemes:
  NotesApp:
    build:
      targets:
        NotesApp: all
        NotesAppTests: [test]
        NotesAppUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - NotesAppTests
        - NotesAppUITests
