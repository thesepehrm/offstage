[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offstage"
version = "0.1.0"
description = "Background-safe autonomous QA harness for macOS apps: AX perception, semantic ports, ScreenCaptureKit goldens — while you keep using your Mac."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["macos", "qa", "testing", "accessibility", "agents", "screencapturekit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
offstage = "offstage.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
offstage = ["probes/*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: needs a live macOS session with AX + Screen Recording permissions (deselect with -m 'not live')",
]
